[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zir-image-enhancer"
version = "0.1.0"
description = "Turn a few phone photos of a garment into one clean studio shot."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # The app and zir-run only call hosted models, so no torch or GPU is needed to run them.
    "gradio>=6.30.0",
    "numpy>=1.26.0",
    "pillow>=10.4.0",
    "pillow-heif>=0.18.0", # iPhone photos arrive as HEIC
    "fal-client>=1.0.0", # hosted generation and vision (FAL_KEY)
    "httpx>=0.27.0", # downloads fal results; already a fal-client dependency
    "python-dotenv>=1.0.0", # reads FAL_KEY and the budget limit from .env
]

[project.optional-dependencies]
# The official Sartiq reference-similarity scorer. The frozen `sartiq-score` package
# itself is vendored (unmodified) under `tools/scorer/` and installed from there via
# [tool.uv.sources]; this extra only pulls the third-party dependencies it needs on top
# of the base dependencies. Install it with `uv sync --all-extras`.
scorer = [
    "sartiq-score",
    "scipy>=1.11",
    "lpips>=0.1.4",
    "open_clip_torch>=2.24",
    "rembg>=2.0.50",
    "onnxruntime>=1.17",
    "tqdm>=4.66",
]

[dependency-groups]
# Installed by `uv sync` (and thus available to `uv run`) by default.
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pre-commit>=4.0.0",
]

[project.scripts]
zir-app = "zir_image_enhancer.app:main"
zir-run = "zir_image_enhancer.cli:main"

# The vendored, frozen scorer is installed from this path source wherever the
# `scorer` extra is requested (e.g. `uv pip install -e ".[scorer]"`).
[tool.uv.sources]
sartiq-score = { path = "tools/scorer", editable = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]
# Vendored, unmodified code from the Neural Wave 2026 starter repo (see README):
# keep it byte-identical to upstream rather than reformatting it.
extend-exclude = ["tools", "scripts/eval_val.py", "scripts/make_holdout.py", "scripts/make_submission.py", "local", "data"]

[tool.ruff.lint]
# ANN enforces type hints on every function, which is the team convention.
select = ["E", "F", "W", "I", "B", "UP", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
warn_unused_ignores = true
# Most ML libraries ship without type stubs; without this, mypy fails on every import.
ignore_missing_imports = true
# The vendored starter scripts stay byte-identical to upstream, so they are not type-checked.
exclude = ['scripts/(eval_val|make_holdout|make_submission)\.py$', '^tools/']

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Never collect the vendored upstream code or generated run outputs.
norecursedirs = ["tools", "scripts", ".venv", "local", "data", "holdout", "submissions", "predictions", "val_*"]
